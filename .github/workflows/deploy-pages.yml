name: Deploy GitHub Pages

on:
  workflow_call:
    secrets:
      EASYINK_ASSISTANT_SERVER_URL:
        required: false
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publishing a maintenance series must still build the complete website.
      - name: Checkout central documentation infrastructure
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Fix documentation source commits
        run: node scripts/docs-versions.mjs resolve --git-sources --sources-file .cache/docs-sources.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare build metadata
        shell: bash
        run: |
          {
            echo "VITE_BUILD_SHA=$(git rev-parse HEAD)"
            echo "VITE_BUILD_REF_NAME=main"
            echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_ENV"

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test documentation infrastructure
        run: pnpm exec vitest run scripts/docs-site.test.mjs docs/.vitepress/versioning.test.ts

      - name: Build playground
        env:
          VITE_EASYINK_ASSISTANT_ENDPOINT: ${{ secrets.EASYINK_ASSISTANT_SERVER_URL }}
        run: pnpm --filter @easyink/playground build

      - name: Build all documentation series
        run: pnpm docs:build:all --sources-file .cache/docs-sources.json --out .pages/docs

      - name: Assemble Pages artifact
        shell: bash
        run: |
          cp -R playground/dist/. .pages/
          node scripts/docs-versions.mjs check --out .pages/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
